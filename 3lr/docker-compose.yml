services:
  db:
    image: postgres:18
    container_name: shop_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: shopdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shopdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: ./app
    image: shop_app:1.0
    container_name: shop_app
    volumes:
      - ./log:/app_logs/
    env_file:
      - ./app.env
    depends_on:
      db:
        condition: service_healthy
    stdin_open: true
    tty: true
